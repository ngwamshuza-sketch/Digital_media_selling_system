<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineBox – Movie Streaming & Download</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ───────────── RESET & ROOT ───────────── */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080810;--bg2:#0e0e18;--bg3:#141420;--bg4:#1c1c28;--bg5:#222232;
  --accent:#e8a020;--accent2:#f5bc45;--accentDim:#e8a0201a;--accentBorder:#e8a02040;
  --red:#e05555;--redDim:#e0555520;--green:#3ecb8a;--greenDim:#3ecb8a20;
  --blue:#4a9eff;--blueDim:#4a9eff20;--purple:#9b6fff;
  --text:#f0f0f8;--text2:#9090b0;--text3:#505068;--text4:#303045;
  --border:#1e1e2e;--border2:#2a2a3e;--border3:#363650;
  --card:#0e0e18;--cardHov:#141420;
  --radius:10px;--radiusLg:14px;--radiusSm:7px;
  --sidebar:220px;--topbar:54px;
  --font:'DM Sans',sans-serif;--fontHead:'Syne',sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}
input,select,textarea,button{font-family:inherit}
a{text-decoration:none;color:inherit}

/* ───────────── SCROLLBAR ───────────── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border3);border-radius:4px}

/* ───────────── LAYOUT ───────────── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;
  z-index:200;transition:width .25s cubic-bezier(.4,0,.2,1);flex-shrink:0;
}
.sidebar.collapsed{width:60px}
.main-wrap{
  margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;
  height:100vh;overflow:hidden;transition:margin-left .25s cubic-bezier(.4,0,.2,1);
}
.sidebar.collapsed~.main-wrap{margin-left:60px}
.content-area{flex:1;overflow-y:auto;overflow-x:hidden}

/* ───────────── SIDEBAR ───────────── */
.logo-area{
  height:var(--topbar);padding:0 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.logo-mark{
  width:30px;height:30px;border-radius:8px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;
  font-size:14px;color:#000;font-family:var(--fontHead);flex-shrink:0;letter-spacing:-1px;
}
.logo-name{font-family:var(--fontHead);font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;opacity:1;transition:opacity .2s}
.logo-name em{color:var(--accent);font-style:normal}
.sidebar.collapsed .logo-name{opacity:0;width:0}

.nav-section{padding:10px 0}
.nav-label{
  font-size:10px;text-transform:uppercase;letter-spacing:1.2px;
  color:var(--text3);padding:6px 16px 4px;white-space:nowrap;
  overflow:hidden;transition:opacity .2s;
}
.sidebar.collapsed .nav-label{opacity:0}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 15px;cursor:pointer;
  color:var(--text2);transition:color .15s,background .15s;position:relative;
  white-space:nowrap;overflow:hidden;user-select:none;
}
.nav-item:hover{color:var(--text);background:var(--bg3)}
.nav-item.active{color:var(--accent);background:var(--accentDim)}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:6px;bottom:6px;
  width:3px;background:var(--accent);border-radius:0 3px 3px 0;
}
.nav-icon{width:20px;text-align:center;font-size:14px;flex-shrink:0}
.nav-label-text{font-size:13px;font-weight:500;overflow:hidden;flex:1}
.sidebar.collapsed .nav-label-text{display:none}
.nav-badge{
  background:var(--accent);color:#000;font-size:10px;font-weight:700;
  border-radius:10px;padding:1px 7px;flex-shrink:0;
}
.sidebar.collapsed .nav-badge{display:none}

.sidebar-bottom{padding:10px;border-top:1px solid var(--border);flex-shrink:0}
.user-chip{
  display:flex;align-items:center;gap:8px;padding:7px 8px;
  background:var(--bg3);border-radius:var(--radius);cursor:pointer;
  transition:background .15s;overflow:hidden;
}
.user-chip:hover{background:var(--bg4)}
.user-av{
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;color:#000;
  font-family:var(--fontHead);flex-shrink:0;
}
.user-meta{overflow:hidden;flex:1}
.user-name-t{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role-t{font-size:10px;color:var(--accent)}
.sidebar.collapsed .user-meta{display:none}

/* ───────────── TOPBAR ───────────── */
.topbar{
  height:var(--topbar);background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;
  position:sticky;top:0;z-index:100;
}
.icon-btn{
  width:32px;height:32px;border:1px solid var(--border2);background:transparent;
  color:var(--text2);border-radius:var(--radiusSm);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:13px;
  transition:color .15s,border-color .15s,background .15s;flex-shrink:0;
}
.icon-btn:hover{color:var(--text);border-color:var(--border3);background:var(--bg3)}
.search-wrap{flex:1;max-width:380px;position:relative}
.search-wrap input{
  width:100%;background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--radius);padding:7px 12px 7px 32px;color:var(--text);
  font-size:12px;outline:none;transition:border-color .15s,background .15s;
}
.search-wrap input:focus{border-color:var(--accentBorder);background:var(--bg4)}
.search-wrap input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:12px;pointer-events:none}
.topbar-right{display:flex;align-items:center;gap:6px;margin-left:auto}
.notif-rel{position:relative}
.notif-dot{position:absolute;top:5px;right:5px;width:6px;height:6px;background:var(--accent);border-radius:50%;border:1.5px solid var(--bg2)}
.view-toggle{display:flex;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radiusSm);overflow:hidden}
.vt-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);font-size:11px;transition:color .15s,background .15s}
.vt-btn.active{background:var(--accentDim);color:var(--accent)}
.portal-select{
  background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radiusSm);
  color:var(--text2);font-size:11px;padding:5px 8px;outline:none;cursor:pointer;
}
.portal-select option{background:var(--bg3)}

/* ───────────── PAGE SHELL ───────────── */
.page{padding:18px 20px;display:none;min-height:100%}
.page.active{display:block}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.ph-left{}
.page-title{font-family:var(--fontHead);font-size:20px;font-weight:700;line-height:1.2}
.page-sub{font-size:12px;color:var(--text2);margin-top:2px}
.ph-right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* ───────────── BUTTONS ───────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;
  border-radius:var(--radiusSm);font-size:12px;font-weight:500;cursor:pointer;
  border:none;transition:all .15s;white-space:nowrap;line-height:1;
}
.btn i{font-size:11px}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{color:var(--text);border-color:var(--border3);background:var(--bg3)}
.btn-danger{background:var(--redDim);color:var(--red);border:1px solid #e0555530}
.btn-danger:hover{background:#e0555530}
.btn-success{background:var(--greenDim);color:var(--green);border:1px solid #3ecb8a30}
.btn-success:hover{background:#3ecb8a30}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}
.btn-xs{padding:3px 8px;font-size:10px;border-radius:5px}
.btn-block{width:100%;justify-content:center}
.btn-lg{padding:10px 20px;font-size:13px}

/* ───────────── STAT CARDS ───────────── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radiusLg);
  padding:14px 16px;position:relative;overflow:hidden;
}
.stat-glow{position:absolute;top:-10px;right:-10px;width:60px;height:60px;border-radius:50%;opacity:.08}
.stat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
.stat-val{font-family:var(--fontHead);font-size:22px;font-weight:700;line-height:1}
.stat-foot{display:flex;align-items:center;gap:5px;font-size:11px;margin-top:7px}
.stat-ico{position:absolute;top:14px;right:14px;font-size:18px;color:var(--text4)}
.up{color:var(--green)}.dn{color:var(--red)}

/* ───────────── CHARTS ───────────── */
.chart-row{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-bottom:18px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radiusLg);padding:16px}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.chart-title{font-family:var(--fontHead);font-size:13px;font-weight:600}
.chart-sub{font-size:11px;color:var(--text3)}
.bar-track{display:flex;align-items:flex-end;gap:5px;height:90px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-fill{width:100%;border-radius:3px 3px 0 0;background:var(--accentDim);border:1px solid var(--accentBorder);transition:background .2s;cursor:pointer;min-height:3px}
.bar-fill:hover{background:var(--accent)}
.bar-lbl{font-size:9px;color:var(--text3);text-align:center}
.donut-wrap{display:flex;flex-direction:column;justify-content:center;height:100%;gap:8px}
.donut-item{display:flex;align-items:center;gap:8px}
.donut-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.donut-label{font-size:11px;color:var(--text2);flex:1}
.donut-pct{font-size:11px;font-weight:500}
.donut-bar-bg{flex:1;height:4px;background:var(--bg4);border-radius:4px;overflow:hidden}
.donut-bar-fill{height:100%;border-radius:4px}

/* ───────────── MOVIE GRID ───────────── */
.filter-bar{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.chip{
  padding:4px 11px;border-radius:20px;font-size:11px;font-weight:500;
  border:1px solid var(--border2);color:var(--text2);cursor:pointer;
  transition:all .15s;background:transparent;
}
.chip:hover{color:var(--text);border-color:var(--border3)}
.chip.on{background:var(--accentDim);color:var(--accent);border-color:var(--accentBorder)}
.sort-sel{
  margin-left:auto;background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--radiusSm);color:var(--text2);font-size:11px;
  padding:5px 10px;outline:none;cursor:pointer;
}
.movie-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.movie-grid.cols4{grid-template-columns:repeat(4,1fr)}
.movie-grid.cols3{grid-template-columns:repeat(3,1fr)}
.movie-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;
  position:relative;
}
.movie-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px #00000070;border-color:var(--border2)}
.movie-card:hover .mc-overlay{opacity:1}
.mc-poster{
  width:100%;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;
  font-size:32px;color:var(--text4);
}
.mc-overlay{
  position:absolute;inset:0;background:linear-gradient(to top,#000000e0 35%,transparent 65%);
  opacity:0;transition:opacity .2s;display:flex;flex-direction:column;
  justify-content:flex-end;padding:8px;
}
.mc-btns{display:flex;gap:5px;margin-bottom:5px}
.mc-btn{
  flex:1;padding:5px 0;border-radius:5px;border:none;font-size:10px;
  font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;
}
.mc-btn-t{background:#ffffff25;color:#fff;backdrop-filter:blur(4px)}
.mc-btn-t:hover{background:#ffffff35}
.mc-btn-b{background:var(--accent);color:#000}
.mc-btn-b:hover{background:var(--accent2)}
.mc-badge{
  position:absolute;top:6px;left:6px;font-size:9px;font-weight:700;
  padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.4px;
}
.mc-badge.new{background:var(--green);color:#000}
.mc-badge.hot{background:var(--red);color:#fff}
.mc-badge.free{background:var(--purple);color:#fff}
.mc-info{padding:8px 9px 10px}
.mc-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;font-family:var(--fontHead)}
.mc-foot{display:flex;align-items:center;justify-content:space-between}
.mc-price{font-size:12px;color:var(--accent);font-weight:700}
.mc-cat{font-size:9px;color:var(--text3);background:var(--bg3);padding:2px 6px;border-radius:4px;border:1px solid var(--border)}
.mc-dj{font-size:9px;color:var(--text3);margin-top:2px}

/* list view */
.movie-list{display:flex;flex-direction:column;gap:6px}
.movie-list-item{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.movie-list-item:hover{background:var(--cardHov);border-color:var(--border2)}
.ml-thumb{width:40px;height:60px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text4)}
.ml-info{flex:1;min-width:0}
.ml-title{font-size:13px;font-weight:600;font-family:var(--fontHead);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml-meta{font-size:11px;color:var(--text2)}
.ml-price{font-size:13px;color:var(--accent);font-weight:700;flex-shrink:0}
.ml-actions{display:flex;gap:5px;flex-shrink:0}

/* ───────────── TABLES ───────────── */
.tbl-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radiusLg);overflow:hidden;margin-bottom:16px}
.tbl-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;
}
.tbl-title{font-family:var(--fontHead);font-size:13px;font-weight:600}
.tbl-actions{display:flex;gap:6px;align-items:center}
.tbl-search{
  background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radiusSm);
  padding:5px 10px;color:var(--text);font-size:11px;outline:none;width:170px;
}
.tbl-search::placeholder{color:var(--text3)}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--bg3)}
th{
  text-align:left;padding:9px 14px;font-size:10px;text-transform:uppercase;
  letter-spacing:.6px;color:var(--text3);font-weight:500;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
td{padding:9px 14px;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover td{background:var(--bg3);color:var(--text)}
.td-main{color:var(--text)!important;font-weight:500}
.av{
  width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:700;margin-right:7px;
  vertical-align:middle;flex-shrink:0;
}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600}
.pill-green{background:var(--greenDim);color:var(--green)}
.pill-amber{background:var(--accentDim);color:var(--accent)}
.pill-red{background:var(--redDim);color:var(--red)}
.pill-gray{background:var(--bg4);color:var(--text3)}
.pill-blue{background:var(--blueDim);color:var(--blue)}
.pill i{font-size:6px}

/* ───────────── FORMS ───────────── */
.form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radiusLg);padding:18px;margin-bottom:14px}
.form-card-title{font-family:var(--fontHead);font-size:14px;font-weight:600;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid.cols1{grid-template-columns:1fr}
.fgrid.cols3{grid-template-columns:1fr 1fr 1fr}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
.fg label{font-size:11px;color:var(--text2);font-weight:500}
.fg input,.fg select,.fg textarea{
  background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radiusSm);
  padding:8px 10px;color:var(--text);font-size:12px;outline:none;
  transition:border-color .15s,background .15s;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accentBorder);background:var(--bg4)}
.fg input::placeholder,.fg textarea::placeholder{color:var(--text3)}
.fg textarea{resize:vertical;min-height:80px;line-height:1.5}
.fg select option{background:var(--bg3)}
.upload-zone{
  border:1.5px dashed var(--border3);border-radius:var(--radius);
  padding:22px 16px;text-align:center;cursor:pointer;transition:all .15s;
  background:var(--bg3);
}
.upload-zone:hover{border-color:var(--accent);background:var(--accentDim)}
.upload-zone i{font-size:24px;color:var(--text3);margin-bottom:7px;display:block}
.upload-zone p{font-size:12px;color:var(--text2);margin-bottom:3px}
.upload-zone span{font-size:10px;color:var(--text3)}
.form-footer{display:flex;gap:8px;margin-top:4px}

/* ───────────── HERO / BANNER ───────────── */
.hero-band{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radiusLg);
  padding:20px;margin-bottom:18px;display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden;
}
.hero-band::after{
  content:'';position:absolute;right:-30px;top:-30px;width:160px;height:160px;
  border-radius:50%;background:var(--accentDim);pointer-events:none;
}
.hero-av{
  width:48px;height:48px;border-radius:12px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  font-weight:800;color:#000;font-family:var(--fontHead);flex-shrink:0;z-index:1;
}
.hero-text h2{font-family:var(--fontHead);font-size:18px;font-weight:700;margin-bottom:3px}
.hero-text p{font-size:12px;color:var(--text2)}
.hero-actions{margin-left:auto;z-index:1;display:flex;gap:8px;flex-shrink:0}

/* ───────────── EARN CARDS ───────────── */
.earn-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.earn-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.earn-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.earn-val{font-family:var(--fontHead);font-size:18px;font-weight:700;color:var(--accent)}
.earn-note{font-size:10px;color:var(--text3);margin-top:4px}

/* ───────────── NOTIF LIST ───────────── */
.notif-list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.notif-item{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:11px 13px;display:flex;align-items:flex-start;gap:10px;
  transition:background .15s;
}
.notif-item.unread{border-left:3px solid var(--accent)}
.notif-item:hover{background:var(--bg3)}
.n-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.n-body{flex:1}
.n-msg{font-size:12px;line-height:1.5;color:var(--text)}
.n-time{font-size:10px;color:var(--text3);margin-top:2px}
.n-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:5px}

/* ───────────── SECTION TITLE ───────────── */
.sec-title{
  font-family:var(--fontHead);font-size:13px;font-weight:600;
  margin-bottom:11px;display:flex;align-items:center;gap:8px;
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
.sec-actions{display:flex;gap:6px;align-items:center;margin-left:auto;margin-right:8px}

/* ───────────── FEATURED MOVIE (User Home) ───────────── */
.featured-wrap{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radiusLg);
  overflow:hidden;margin-bottom:18px;position:relative;
}
.featured-img{
  width:100%;height:200px;display:flex;align-items:center;justify-content:center;
  font-size:60px;color:var(--text4);
}
.featured-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to right,#000000dd 40%,#00000088 70%,transparent);
  display:flex;align-items:flex-end;padding:20px;
}
.feat-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);margin-bottom:5px}
.feat-title{font-family:var(--fontHead);font-size:20px;font-weight:800;margin-bottom:5px;line-height:1.2}
.feat-desc{font-size:12px;color:var(--text2);margin-bottom:11px;line-height:1.55;max-width:280px}
.feat-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.feat-pill{
  font-size:10px;color:var(--text2);background:var(--bg4);
  padding:3px 8px;border-radius:5px;border:1px solid var(--border);
}

/* ───────────── AUTH ───────────── */
.auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:20px;
}
.auth-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radiusLg);
  padding:30px;width:100%;max-width:370px;
}
.auth-logo{display:flex;align-items:center;gap:9px;margin-bottom:22px}
.auth-logo-name{font-family:var(--fontHead);font-size:17px;font-weight:700}
.auth-logo-name em{color:var(--accent);font-style:normal}
.auth-h{font-family:var(--fontHead);font-size:19px;font-weight:700;margin-bottom:4px}
.auth-s{font-size:12px;color:var(--text2);margin-bottom:20px}
.auth-form{display:flex;flex-direction:column;gap:13px}
.or-div{text-align:center;font-size:11px;color:var(--text3);position:relative;margin:2px 0}
.or-div::before,.or-div::after{content:'';position:absolute;top:50%;width:44%;height:1px;background:var(--border)}
.or-div::before{left:0}.or-div::after{right:0}
.auth-link{color:var(--accent);cursor:pointer;font-weight:500}

/* ───────────── PAYMENT ───────────── */
.pay-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;flex-direction:column;gap:12px}
.pay-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radiusLg);padding:22px;width:100%;max-width:360px}
.pay-h{font-family:var(--fontHead);font-size:16px;font-weight:700;margin-bottom:3px}
.pay-s{font-size:12px;color:var(--text2);margin-bottom:16px}
.pay-amount-box{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:14px;text-align:center;margin-bottom:14px}
.pay-amount-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.pay-amount-val{font-family:var(--fontHead);font-size:28px;font-weight:800;color:var(--accent)}
.pay-movie{font-size:11px;color:var(--text2);margin-top:3px}
.pay-methods{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.pay-method{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s;
}
.pay-method:hover{border-color:var(--border3);background:var(--bg3)}
.pay-method.sel{border-color:var(--accentBorder);background:var(--accentDim)}
.pay-m-icon{width:30px;height:30px;border-radius:7px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid var(--border2)}
.pay-m-name{font-size:12px;font-weight:500;flex:1}
.pay-note{font-size:10px;color:var(--text3);text-align:center;margin-top:10px}

/* ───────────── DOWNLOAD PAGE ───────────── */
.dl-success{
  background:var(--greenDim);border:1px solid #3ecb8a30;border-radius:var(--radius);
  padding:14px 16px;display:flex;align-items:center;gap:10px;margin-bottom:16px;
}
.dl-success i{color:var(--green);font-size:18px;flex-shrink:0}
.dl-success p{font-size:12px;line-height:1.5}

/* ───────────── SETTINGS ───────────── */
.settings-tabs{display:flex;gap:1px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;width:fit-content}
.st-tab{padding:7px 16px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .15s}
.st-tab.active{background:var(--accentDim);color:var(--accent)}

/* ───────────── RESPONSIVE ───────────── */
@media(max-width:1100px){.movie-grid{grid-template-columns:repeat(4,1fr)}.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .movie-grid{grid-template-columns:repeat(3,1fr)}
  .chart-row{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .fgrid.cols3{grid-template-columns:1fr 1fr}
  .earn-row{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:680px){
  :root{--sidebar:60px}
  .logo-name,.nav-label-text,.nav-badge,.nav-label,.user-meta{display:none!important}
  .movie-grid{grid-template-columns:repeat(2,1fr)}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .earn-row{grid-template-columns:1fr 1fr}
  .page{padding:14px}
  .topbar{padding:0 10px;gap:7px}
  .search-wrap{max-width:none}
  .chart-row{grid-template-columns:1fr}
}
@media(max-width:420px){
  .movie-grid{grid-template-columns:repeat(2,1fr)}
  .stats-grid{grid-template-columns:1fr 1fr}
}
</style>

/* ══════════════════════════════════════
   HELPERS
══════════════════════════════════════ */
function ini(name){return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
const COLORS=['#e8a020','#4a9eff','#3ecb8a','#9b6fff','#e05555','#f5bc45'];
function avColor(seed){return COLORS[seed%COLORS.length]}
function fmt(n){return '$'+n.toFixed(2)}

function pill(status){
  const map={active:'green',paid:'green',pending:'amber',blocked:'red',failed:'red',inactive:'gray',processing:'blue'};
  const cls=map[status]||'gray';
  return `<span class="pill pill-${cls}"><i class="fas fa-circle"></i>${status}</span>`;
}

function render(){

  if(S.portal==='register'){app.innerHTML=buildRegister();return}
  if(S.portal==='forgot'){app.innerHTML=buildForgot();return}
  if(S.portal==='payment'){app.innerHTML=buildPaymentPage();return}
  app.innerHTML=buildShell();
}

/* ══════════════════════════════════════

══════════════════════════════════════ */
function moviesPage(){
  let filtered=S.searchQ
    ?MOVIES.filter(m=>m.title.toLowerCase().includes(S.searchQ.toLowerCase()))
    :MOVIES;
  if(S.cat!=='All') filtered=filtered.filter(m=>m.cat===S.cat);
  return `<div class="page active">
    <div class="ph">
      <div class="ph-left"><div class="page-title">Movies</div><div class="page-sub">${filtered.length} of ${MOVIES.length} movies</div></div>
      <div class="ph-right">
        <button class="btn btn-ghost btn-sm"><i class="fas fa-sliders"></i> Filters</button>
        <button class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> Add Movie</button>
      </div>
    </div>
    <div class="filter-bar">
      ${CATS.map(c=>`<div class="chip${S.cat===c?' on':''}" onclick="S.cat='${c}';render()">${c}</div>`).join('')}
      <select class="sort-sel">
        <option>Latest</option><option>Most Popular</option>
        <option>Price: Low to High</option><option>Price: High to Low</option>
      </select>

      ${CATS.map(c=>`<div class="chip${S.cat===c?' on':''}" onclick="S.cat='${c}';render()">${c}</div>`).join('')}
      <select class="sort-sel"><option>Latest</option><option>Popular</option><option>Price: Low</option></select>
    </div>
    <div class="sec-title">Browse Movies <span style="font-size:11px;color:var(--text3);font-weight:400;font-family:var(--font)">${filtered.length} titles</span></div>
    ${S.gridMode==='grid'
      ?`<div class="movie-grid">${filtered.map(m=>movieCard(m)).join('')}</div>`
      :`<div class="movie-list">${filtered.map(m=>movieListItem(m)).join('')}</div>`
    }
  </div>`;
}

            <div style="position:absolute;top:6px;right:6px;background:var(--greenDim);border:1px solid #3ecb8a30;border-radius:5px;padding:2px 7px;font-size:9px;font-weight:700;color:var(--green)">OWNED</div>

function downloadsPage(){

    <div class="tbl-card">
      <table>
        <thead><tr><th>Movie</th><th>Purchased</th><th>Link Status</th><th>Action</th></tr></thead>
        <tbody>
          ${MOVIES.slice(0,3).map((m,i)=>`
            <tr>
              <td class="td-main"><div style="display:flex;align-items:center;gap:8px">
                <div style="width:36px;height:54px;border-radius:5px;background:linear-gradient(145deg,${m.bg},#050508);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text4);flex-shrink:0"><i class="fas fa-film"></i></div>
                <div><div>${m.title}</div><div style="font-size:10px;color:var(--text3)">${m.cat} · ${m.dj}</div></div>
              </div></td>
              <td>${['May 1, 2025','Apr 30, 2025','Apr 28, 2025'][i]}</td>
              <td>${i===0
                ?`<span class="pill pill-amber"><i class="fas fa-clock"></i>Expires in 18h</span>`
                :`<span class="pill pill-gray"><i class="fas fa-xmark"></i>Expired</span>`
              }</td>
              <td>
                ${i===0
                  ?`<button class="btn btn-success btn-sm"><i class="fas fa-download"></i> Download</button>`
                  :`<button class="btn btn-primary btn-sm" onclick="buyMovie(${m.id})">Repurchase</button>`
                }

            </tr>`).join('')}
        </tbody>

function userNotifs(){
  return `<div class="page active">
    <div class="ph"><div class="ph-left"><div class="page-title">Notifications</div></div></div>
    <div class="notif-list">${NOTIFS.slice(0,4).map(n=>`
      <div class="notif-item${n.unread?' unread':''}">
        <div class="n-icon" style="background:${n.bg}"><i class="fas ${n.icon}" style="color:${n.ic}"></i></div>
        <div class="n-body"><div class="n-msg">${n.msg}</div><div class="n-time">${n.time}</div></div>
        ${n.unread?'<div class="n-dot"></div>':''}
      </div>`).join('')}
    </div>
  </div>`;
}

/* ══════════════════════════════════════
   PAYMENT PAGE
══════════════════════════════════════ */
function buildPaymentPage(){
  const m=MOVIES.find(x=>x.id===S.buyMovieId)||MOVIES[0];
  const methods=[
    {icon:'fa-mobile-screen-button',label:'M-Pesa',sub:'Safaricom mobile money'},
    {icon:'fa-mobile-screen-button',label:'Airtel Money',sub:'Airtel mobile money'},
    {icon:'fa-credit-card',label:'Card Payment',sub:'Visa, Mastercard, Amex'},
  ];
  return `<div class="pay-wrap">
    <button class="btn btn-ghost btn-sm" onclick="S.portal=S.prevPortal||'user';go('home')"><i class="fas fa-arrow-left"></i> Back to browsing</button>
    <div class="pay-card">
      <div class="pay-h">Complete Purchase</div>
      <div class="pay-s">Secure checkout · Download access for 24 hours</div>
      <div class="pay-amount-box">
        <div class="pay-amount-lbl">Total Amount</div>
        <div class="pay-amount-val">${fmt(m.price)}</div>
        <div class="pay-movie">${m.title} · ${m.cat}</div>
      </div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:8px">Select payment method:</div>
      <div class="pay-methods">
        ${methods.map((mt,i)=>`
          <div class="pay-method${S.payMethod===i?' sel':''}" onclick="S.payMethod=${i};render()">
            <div class="pay-m-icon"><i class="fas ${mt.icon}"></i></div>
            <div>
              <div class="pay-m-name">${mt.label}</div>
              <div style="font-size:10px;color:var(--text3)">${mt.sub}</div>
            </div>
            ${S.payMethod===i?`<i class="fas fa-circle-check" style="margin-left:auto;color:var(--accent)"></i>`:''}
          </div>`).join('')}
      </div>
      <button class="btn btn-primary btn-block btn-lg" onclick="switchPortal('user');go('downloads')">
        <i class="fas fa-lock"></i> Pay ${fmt(m.price)} Securely
      </button>
      <div class="pay-note"><i class="fas fa-shield-halved" style="color:var(--green);margin-right:4px"></i>256-bit encrypted · Download link sent instantly after payment</div>
    </div>
  </div>`;
}

/* ══════════════════════════════════════
   ACTIONS
══════════════════════════════════════ */
function go(page){
  S.page=page;
  render();
  document.querySelector('.content-area')?.scrollTo(0,0);
}

function switchPortal(portal){
  S.prevPortal=S.portal;
  S.portal=portal;
  const defaults={admin:'dashboard',dj:'dj-dashboard',user:'home',login:'',register:'',forgot:'',payment:''};
  if(defaults[portal]!==undefined) S.page=defaults[portal];
  render();
}

function toggleSidebar(){
  S.collapsed=!S.collapsed;
  const sb=document.getElementById('sidebar');
  if(sb) sb.classList.toggle('collapsed');
}

function buyMovie(id){
  S.buyMovieId=id;
  S.prevPortal=S.portal;
  S.portal='payment';
  render();
}

function openMovieDetail(id){
  // Stub – would open movie detail modal/page
  console.log('Open movie',id);
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
render();
</script>
